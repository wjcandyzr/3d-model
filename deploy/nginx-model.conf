# 户型还原模型 → https://model.yyzzrr.top (same releases as port 8090)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name model.yyzzrr.top;

    ssl_certificate     /etc/letsencrypt/live/model.yyzzrr.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/model.yyzzrr.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/house-releases/current;   # each deploy uploads a new release and flips this symlink
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(jpg|jpeg|png|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    gzip on;
    gzip_types application/javascript text/css;
}

server {
    listen 80;
    listen [::]:80;
    server_name model.yyzzrr.top;
    return 301 https://$host$request_uri;
}
