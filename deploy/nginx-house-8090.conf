# 户型还原模型 (static site)
server {
    listen 8090;
    listen [::]:8090;
    server_name _;
    root /var/www/house-releases/current;   # each deploy uploads a new release and flips this symlink
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(jpg|jpeg|png|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    gzip on;
    gzip_types application/javascript text/css;
}
